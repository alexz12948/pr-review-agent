<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Review Agent — Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; padding: 24px; }
        h1 { margin-bottom: 24px; color: #1a1a2e; }
        .cards { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
        .card { background: #fff; border-radius: 12px; padding: 20px 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); min-width: 180px; flex: 1; }
        .card h3 { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .card .value { font-size: 2rem; font-weight: 700; color: #1a1a2e; }
        .chart-container { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 32px; max-width: 400px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #eee; }
        th { background: #1a1a2e; color: #fff; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        tr:hover { background: #f9f9fb; }
        .status-success { color: #27ae60; font-weight: 600; }
        .status-failed { color: #e74c3c; font-weight: 600; }
        .status-partial { color: #f39c12; font-weight: 600; }
        a { color: #2980b9; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .loading { color: #aaa; font-style: italic; }
    </style>
</head>
<body>
    <h1>PR Review Agent Dashboard</h1>

    <div class="cards">
        <div class="card">
            <h3>Total PRs Reviewed</h3>
            <div class="value" id="total-prs">—</div>
        </div>
        <div class="card">
            <h3>Avg Latency</h3>
            <div class="value" id="avg-latency">—</div>
        </div>
        <div class="card">
            <h3>Total Findings</h3>
            <div class="value" id="total-findings">—</div>
        </div>
    </div>

    <div class="chart-container">
        <h3 style="margin-bottom: 16px; color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">Severity Breakdown</h3>
        <canvas id="severity-chart"></canvas>
    </div>

    <h2 style="margin-bottom: 12px;">Recent Reviews</h2>
    <table>
        <thead>
            <tr>
                <th>Repo</th>
                <th>PR</th>
                <th>Status</th>
                <th>Security</th>
                <th>Quality</th>
                <th>Latency</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="reviews-body">
            <tr><td colspan="7" class="loading">Loading…</td></tr>
        </tbody>
    </table>

    <script>
        let severityChart = null;

        async function loadStats() {
            try {
                const resp = await fetch('/api/stats');
                const stats = await resp.json();

                document.getElementById('total-prs').textContent = stats.total_prs;
                document.getElementById('avg-latency').textContent = stats.avg_latency + 's';

                const tf = stats.total_findings;
                const totalCount = tf.critical + tf.high + tf.medium + tf.low;
                document.getElementById('total-findings').textContent = totalCount;

                const ctx = document.getElementById('severity-chart').getContext('2d');
                if (severityChart) severityChart.destroy();
                severityChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['Critical', 'High', 'Medium', 'Low'],
                        datasets: [{
                            data: [tf.critical, tf.high, tf.medium, tf.low],
                            backgroundColor: ['#e74c3c', '#e67e22', '#f1c40f', '#3498db'],
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            } catch (err) {
                console.error('Failed to load stats:', err);
            }
        }

        async function loadReviews() {
            try {
                const resp = await fetch('/api/reviews');
                const reviews = await resp.json();
                const tbody = document.getElementById('reviews-body');

                if (reviews.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="loading">No reviews yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = reviews.map(r => {
                    const prUrl = `https://github.com/${r.repo}/pull/${r.pr_number}`;
                    const statusClass = `status-${r.status}`;
                    const date = new Date(r.created_at).toLocaleDateString();
                    return `<tr>
                        <td>${r.repo}</td>
                        <td><a href="${prUrl}" target="_blank">#${r.pr_number}</a></td>
                        <td class="${statusClass}">${r.status}</td>
                        <td>${r.security_findings}</td>
                        <td>${r.quality_findings}</td>
                        <td>${r.latency_seconds.toFixed(1)}s</td>
                        <td>${date}</td>
                    </tr>`;
                }).join('');
            } catch (err) {
                console.error('Failed to load reviews:', err);
                document.getElementById('reviews-body').innerHTML =
                    '<tr><td colspan="7" class="loading">Error loading reviews.</td></tr>';
            }
        }

        loadStats();
        loadReviews();
    </script>
</body>
</html>
